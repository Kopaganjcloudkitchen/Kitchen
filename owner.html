<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Owner Panel</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest-owner.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><meta name="theme-color" content="#e8590c"></head><body>
<h1>👨‍🍳 Owner Panel</h1>
<div id="login" class="card"><input id="em" type="email" placeholder="Email"><input id="pw" type="password" placeholder="Password"><button class="w" id="li">Login</button><div id="le" class="bad"></div></div>
<div id="panel" style="display:none">
<div class="card"><b>Dukaan ki location</b><br><small id="sl" class="m"></small><br><button id="ss">📍 Yahi meri dukaan hai</button> <button class="g" id="lo">Logout</button></div>
<h2>Menu</h2><div id="menu"></div>
<div class="card"><b>Naya item</b><input id="mn" placeholder="Item ka naam"><input id="mp" type="number" inputmode="numeric" placeholder="Price ₹"><label class="m">📷 Photo chuno</label><input id="fl" type="file" accept="image/*"><label class="m">🕒 Kab se kab tak milega (khali = poore din)</label><div class="row"><input id="tf" type="time"><input id="tt" type="time"></div><img id="pv" class="th" style="display:none"><div id="am" class="bad"></div><button class="w" id="ab">Add karo</button></div>
<h2>Orders</h2><div id="orders"></div></div>
<script type="module">
import {auth,db,esc,thumb,avail,fmt} from './lib.js';
import {setPersistence,browserLocalPersistence,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {doc,collection,onSnapshot,setDoc,updateDoc,deleteDoc,query,orderBy,limit} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const $=id=>document.getElementById(id);let menu=[],orders=[],started=false,first=true,pimg='',watch=null,last=0,ctx;
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
$('li').onclick=async()=>{try{ctx=new AudioContext();await setPersistence(auth,browserLocalPersistence);await signInWithEmailAndPassword(auth,$('em').value,$('pw').value)}catch(e){$('le').textContent='Email ya password galat hai'}};
$('lo').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{const ok=u&&!u.isAnonymous;$('login').style.display=ok?'none':'block';$('panel').style.display=ok?'block':'none';if(ok&&!started){started=true;start()}});
const beep=()=>{try{const o=ctx.createOscillator();o.connect(ctx.destination);o.frequency.value=880;o.start();setTimeout(()=>o.stop(),600)}catch(e){}};
function start(){
 onSnapshot(doc(db,'cfg','shop'),d=>{const s=d.data();$('sl').textContent=s?s.lat.toFixed(4)+', '+s.lng.toFixed(4):'Set nahi hai'});
 onSnapshot(collection(db,'menu'),q=>{menu=q.docs.map(d=>d.data()).sort((a,b)=>a.id-b.id);$('menu').innerHTML=menu.map(i=>`<div class="card"><div class="row"><span class="fl">${thumb(i)}<span>${esc(i.n)} — ₹${i.p}<br><small class="${avail(i)?'ok':'bad'}">${avail(i)?'Abhi chalu':'Abhi band'}</small></span></span><button class="g" data-del="${i.id}">Hatao</button></div><div class="m" style="margin-top:6px">Price (₹) aur time badlein:</div><div class="row" style="flex-wrap:wrap"><input type="number" inputmode="numeric" data-p="${i.id}" value="${i.p}" style="width:80px"><input type="time" data-f="${i.id}" value="${i.from||''}"><input type="time" data-t="${i.id}" value="${i.to||''}"><button class="g" data-tm="${i.id}">Save</button></div></div>`).join('')});
 onSnapshot(query(collection(db,'orders'),orderBy('id','desc'),limit(60)),q=>{orders=q.docs.map(d=>d.data());if(!first&&q.docChanges().some(c=>c.type=='added'&&c.doc.data().status=='new'))beep();first=false;render();track()},e=>{$('orders').innerHTML='<div class="bad">Yeh account owner nahi hai (rules check karein)</div>'})}
function render(){$('orders').innerHTML=orders.map(o=>{const pend=o.status=='awaiting_payment';
 return `<div class="card" style="${pend?'opacity:.6':''}"><div class="row"><b>${esc(o.name)}</b><span class="m">${pend?'payment pending':o.status}</span></div>
 <div>${o.items.map(i=>esc(i.n)+' ×'+i.q).join(', ')}</div><b>₹${o.total}</b> · ${o.pay} ${o.paid?'✅ paid':o.pay=='COD'?'(cash lena hai)':'(unpaid)'}<br>
 <small class="m">${esc(o.phone)} · ${esc(o.addr)}</small><br><a href="https://www.google.com/maps/dir/?api=1&destination=${o.lat},${o.lng}&travelmode=driving" target="_blank"><button class="g" type="button">🧭 Route dekho (Google Maps)</button></a> <a href="tel:${esc(o.phone)}"><button class="g" type="button">📞 Call</button></a>
 <div style="margin-top:6px">${pend?`<button class="g" data-a="manual" data-id="${o.id}">Paisa mil gaya (manual)</button>`:''}${o.status=='new'?`<button data-a="accepted" data-id="${o.id}">Accept karo</button>`:''}${o.status=='accepted'?`<button data-a="out" data-id="${o.id}">🛵 Delivery ke liye nikla</button>`:''}${o.status=='out'?`<button data-a="done" data-id="${o.id}">Deliver ho gaya</button>`:''}</div></div>`}).join('')||'<div class="m">Abhi koi order nahi</div>'}
$('orders').onclick=async e=>{const b=e.target.closest('button');if(!b)return;const r=doc(db,'orders',b.dataset.id),a=b.dataset.a,o=orders.find(x=>x.id==b.dataset.id);
 if(a=='manual')await updateDoc(r,{paid:true,status:'new'});else if(a=='done')await updateDoc(r,{status:'done',paid:true});else await updateDoc(r,{status:a})};
function track(){const out=orders.filter(o=>o.status=='out');
 if(out.length&&!watch)watch=navigator.geolocation.watchPosition(p=>{if(Date.now()-last<8000)return;last=Date.now();orders.filter(o=>o.status=='out').forEach(o=>updateDoc(doc(db,'orders',String(o.id)),{rider:{lat:p.coords.latitude,lng:p.coords.longitude}}))},()=>alert('Location on rakhein'),{enableHighAccuracy:true});
 if(!out.length&&watch){navigator.geolocation.clearWatch(watch);watch=null}}
$('ss').onclick=()=>navigator.geolocation.getCurrentPosition(p=>setDoc(doc(db,'cfg','shop'),{lat:p.coords.latitude,lng:p.coords.longitude}),()=>alert('Location allow karein'),{enableHighAccuracy:true});
$('menu').onclick=async e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.tm){const id=b.dataset.tm,f=document.querySelector(`[data-f="${id}"]`).value,t=document.querySelector(`[data-t="${id}"]`).value,p=+document.querySelector(`[data-p="${id}"]`).value;if(!(p>0))return alert('Sahi price daalein');if(!!f!=!!t)return alert('Dono time bharein ya dono khali chhodein');await updateDoc(doc(db,'menu',id),{p,from:f,to:t});b.textContent='✅ Save hua'}else if(b.dataset.del&&confirm('Item hatayein?'))deleteDoc(doc(db,'menu',b.dataset.del))};
$('fl').onchange=e=>{const f=e.target.files[0];if(!f)return;const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),k=Math.min(1,320/Math.max(im.width,im.height));c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);pimg=c.toDataURL('image/jpeg',.7);$('pv').src=pimg;$('pv').style.display='block'};im.onerror=()=>{$('am').textContent='Photo khul nahi payi'};im.src=URL.createObjectURL(f)};
$('ab').onclick=async()=>{const n=$('mn').value.trim(),p=+$('mp').value;if(!n||!p){$('am').textContent='Naam aur price bharein';return}
 const id=Date.now();try{await (()=>{const f=$('tf').value,t=$('tt').value;if(!!f!=!!t)throw new Error('Dono time bharein ya dono khali chhodein');return setDoc(doc(db,'menu',String(id)),{id,n,p,img:pimg,from:f,to:t})})();pimg='';$('mn').value=$('mp').value=$('fl').value=$('tf').value=$('tt').value='';$('pv').style.display='none';$('am').textContent='✅ Add ho gaya'}catch(e){$('am').textContent='Error: '+e.message}};
</script></body></html>
